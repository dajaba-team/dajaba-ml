[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-ml"
version = "0.1.0"
description = "Causal ML data preparation and shared account feature kernels"
requires-python = ">=3.12,<3.13"
dependencies = ["duckdb>=1.5.6,<2", "pyarrow>=26,<27", "polars>=1.44,<2", "pandas>=3,<4", "numpy>=2,<3"]

[project.optional-dependencies]
training = ["xgboost>=3.4.1,<3.5"]

[project.scripts]
aml-prepare = "aml_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aml_ml = ["currencies.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
